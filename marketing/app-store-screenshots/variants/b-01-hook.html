<!DOCTYPE html>
<html lang="en">
<head>

<title>Variant B · Hook</title>

</head>
<body>
<div class="slide slide-b bg-hook">

  <div class="slide-b__chip">01 / Hook</div>

  <h1 class="slide-b__headline">
    Stop<br>

  <div class="phone phone--tilt-l3" style="top:1640px;left:80px;width:560px;height:1100px;">

    <div style="font-size:18px;color:#3C3C43;margin-top:4px;">new photos sorted</div>
  </div>

  <div class="slide-b__cartouche">
    Daily <em>output</em>
  </div>

</div>
